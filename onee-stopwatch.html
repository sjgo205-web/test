<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온이 스톱워치</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }
  .photo-frame {
    position: relative;
    animation: bobbing 2.5s ease-in-out infinite;
  }
  @keyframes bobbing {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }
  .photo-circle {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 8px 32px rgba(252,182,159,0.7), 0 0 0 4px #fcb69f;
  }
  .photo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
  .star { position: absolute; animation: twinkle 1.5s ease-in-out infinite; }
  .star:nth-child(1) { top: -12px; right: 8px; font-size: 1.5rem; animation-delay: 0s; }
  .star:nth-child(2) { top: 18px; left: -18px; font-size: 1rem; animation-delay: 0.5s; }
  .star:nth-child(3) { bottom: 8px; right: -12px; font-size: 1.2rem; animation-delay: 1s; }
  @keyframes twinkle {
    0%,100% { opacity: 1; transform: scale(1) rotate(0deg); }
    50% { opacity: 0.3; transform: scale(0.6) rotate(20deg); }
  }
  .name-tag {
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    color: white;
    font-size: 1rem;
    font-weight: 700;
    padding: 7px 22px;
    border-radius: 50px;
    box-shadow: 0 3px 14px rgba(255,154,158,0.5);
    letter-spacing: 2px;
    margin-top: -14px;
    position: relative;
    z-index: 10;
  }
  .stopwatch {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 24px 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(252,182,159,0.45);
    min-width: 320px;
    border: 2px solid rgba(255,255,255,0.95);
  }
  .status-text {
    font-size: 0.82rem;
    color: #fcb69f;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; }
  .dot.on { background: #ff9a9e; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .time-display {
    font-size: 3rem;
    font-weight: 800;
    color: #e05070;
    letter-spacing: 2px;
    font-family: "Courier New", monospace;
    text-shadow: 0 2px 10px rgba(224,80,112,0.2);
  }
  .ms { font-size: 1.7rem; color: #fcb69f; }
  .laps-display {
    margin-top: 10px;
    max-height: 108px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #fcb69f transparent;
  }
  .lap-item {
    font-size: 0.82rem;
    color: #bbb;
    padding: 3px 0;
    border-bottom: 1px solid #fce4ec;
    display: flex;
    justify-content: space-between;
    font-family: "Courier New", monospace;
  }
  .buttons { display: flex; gap: 12px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 11px 22px;
    border: none;
    border-radius: 50px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    outline: none;
  }
  .btn-go { background: linear-gradient(135deg,#ff9a9e,#e05070); color:#fff; box-shadow:0 4px 14px rgba(224,80,112,.35); }
  .btn-go:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(224,80,112,.5); }
  .btn-lap { background: linear-gradient(135deg,#a8edea,#56c9c4); color:#fff; box-shadow:0 4px 14px rgba(86,201,196,.35); }
  .btn-lap:hover { transform:translateY(-2px); }
  .btn-reset { background: linear-gradient(135deg,#d4d4d4,#aaa); color:#fff; box-shadow:0 4px 14px rgba(170,170,170,.3); }
  .btn-reset:hover { transform:translateY(-2px); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
  .btn:active:not(:disabled) { transform:translateY(0) scale(.97); }
  .hearts { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:0; }
  .heart { position:absolute; animation: floatUp linear forwards; }
  @keyframes floatUp {
    0% { transform:translateY(100vh) rotate(0deg); opacity:.7; }
    100% { transform:translateY(-120px) rotate(360deg); opacity:0; }
  }
</style>
</head>

    </div>
  </div>
  <div class="name-tag">🍒 온이 스톱워치 🍒</div>
  <div class="stopwatch">
    <div class="status-text">
      <div class="dot" id="dot"></div>
      <span id="statusLabel">대기 중</span>
    </div>
    <div class="time-display">
      <span id="h">00</span>:<span id="m">00</span>:<span id="s">00</span><span class="ms">.<span id="cs">00</span></span>
    </div>
    <div class="laps-display" id="lapsDisplay"></div>
    <div class="buttons">
      <button class="btn btn-go" id="btnMain" onclick="startStop()">▶ 시작</button>
      <button class="btn btn-lap" id="btnLap" onclick="addLap()" disabled>랩 🍒</button>
      <button class="btn btn-reset" onclick="reset()">↺ 초기화</button>
    </div>
  </div>
</div>
<script>
  let t0=0,elapsed=0,iv=null,running=false,laps=0;
  function fmt(ms){
    return [Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000),Math.floor(ms%1000/10)].map(n=>String(n).padStart(2,"0"));
  }
  function render(ms){
    const[h,m,s,cs]=fmt(ms);
    document.getElementById("h").textContent=h;
    document.getElementById("m").textContent=m;
    document.getElementById("s").textContent=s;
    document.getElementById("cs").textContent=cs;
  }
  function startStop(){
    if(!running){
      t0=Date.now()-elapsed;
      iv=setInterval(()=>{elapsed=Date.now()-t0;render(elapsed);},10);
      running=true;
      document.getElementById("btnMain").textContent="⏸ 일시정지";
      document.getElementById("btnMain").style.background="linear-gradient(135deg,#fddb92,#f6aa3a)";
      document.getElementById("btnLap").disabled=false;
      document.getElementById("dot").className="dot on";
      document.getElementById("statusLabel").textContent="측정 중 💓";
    } else {
      clearInterval(iv);running=false;
      document.getElementById("btnMain").textContent="▶ 계속";
      document.getElementById("btnMain").style.background="linear-gradient(135deg,#ff9a9e,#e05070)";
      document.getElementById("btnLap").disabled=true;
      document.getElementById("dot").className="dot";
      document.getElementById("statusLabel").textContent="일시정지";
    }
  }
  function addLap(){
    laps++;
    const[h,m,s,cs]=fmt(elapsed);
    const d=document.createElement("div");
    d.className="lap-item";
    d.innerHTML=`<span>랩 ${laps}</span><span>${h}:${m}:${s}.${cs}</span>`;
    const ld=document.getElementById("lapsDisplay");
    ld.insertBefore(d,ld.firstChild);
    burst();
  }
  function reset(){
    clearInterval(iv);running=false;elapsed=0;laps=0;
    render(0);
    document.getElementById("btnMain").textContent="▶ 시작";
    document.getElementById("btnMain").style.background="linear-gradient(135deg,#ff9a9e,#e05070)";
    document.getElementById("btnLap").disabled=true;
    document.getElementById("dot").className="dot";
    document.getElementById("statusLabel").textContent="대기 중";
    document.getElementById("lapsDisplay").innerHTML="";
  }
  function burst(){
    ["💗","🍒","✨","💖","🌸"].forEach((e,i)=>{
      setTimeout(()=>{
        const el=document.createElement("div");
        el.className="heart";
        el.textContent=e;
        el.style.cssText=`left:${Math.random()*100}vw;font-size:${0.9+Math.random()*0.8}rem;animation-duration:${1.4+Math.random()}s`;
        document.getElementById("hearts").appendChild(el);
        setTimeout(()=>el.remove(),2400);
      },i*80);
    });
  }
  setInterval(()=>{
    if(!running)return;
    const el=document.createElement("div");
    el.className="heart";
    el.textContent=["💗","🌸","✨"][Math.floor(Math.random()*3)];
    el.style.cssText=`left:${Math.random()*100}vw;font-size:${0.7+Math.random()*0.6}rem;opacity:0.35;animation-duration:${3+Math.random()*2}s`;
    document.getElementById("hearts").appendChild(el);
    setTimeout(()=>el.remove(),5000);
  },900);
</script>
</body>
